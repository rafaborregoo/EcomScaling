# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# App de DESARROLLO (dev stores). La app de produccion es shopify.app.toml
# ("e-nora scale", ADR-0011). Comandos del CLI siempre con --config dev.
#
# Usa temporalmente el mismo client_id que produccion (app "e-nora scale",
# org Partners E-NORA) para no bloquear el plazo de 2 semanas. Si hace falta
# separar dev/produccion mas adelante, crear una segunda app en el Partner
# Dashboard y poner aqui su client_id.

client_id = "3e6944aee89eac806b5d68e2075b5a1e"
name = "e-nora scale"
application_url = "https://ecom.noraapp.es"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Cada scope esta aqui porque una query del sync lo necesita:
#   read_orders -> bulk de pedidos + webhooks orders|refunds
#   read_products / read_inventory / read_locations -> productos, medios, inventoryLevels, locations
#   read_customers -> bulk de clientes (requiere Protected customer data access)
#   read_discounts -> discountNodes y métricas por código promocional
#   read_marketing_events -> eventos/canales de marketing
#   read_reports -> ShopifyQL, bloque `sessions`
#   read_returns -> devoluciones y margen neto
# read_all_orders (historico >60 dias) NO esta: necesita Access request aprobada en
# el Partner Dashboard; sin ella el deploy falla con "scopes: read_all_orders".
scopes = "read_customer_events,read_customers,read_discounts,read_inventory,read_locations,read_marketing_events,read_orders,read_products,read_reports,read_returns,write_pixels"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "http://localhost:4000/v1/shopify/oauth/callback",
  "https://api.ecom.noraapp.es/v1/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.ecom.noraapp.es/v1/shopify/webhooks"

[build]
# false a proposito: `shopify app dev` reescribiria application_url y
# redirect_urls con un tunel efimero y romperia el callback real.
automatically_update_urls_on_dev = false
