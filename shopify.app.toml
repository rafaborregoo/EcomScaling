# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d0387a1ecd87f03ba38ed92cecd12e86"
application_url = "https://dashboard.ecomscaling.es"
embedded = true
name = "EcomScaling - Custom"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_all_orders necesita "Access request" aprobada en el Partner Dashboard
# (historico > 60 dias) antes de instalar en tiendas de merchants reales.
scopes = "read_products,read_inventory,read_locations,read_orders,read_all_orders,read_returns,read_customers"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "http://localhost:4000/v1/shopify/oauth/callback",
  "https://api.ecomscaling.es/v1/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.ecomscaling.es/v1/shopify/webhooks"
