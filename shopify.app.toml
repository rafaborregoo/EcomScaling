# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# App "e-nora scale" creada en la organizacion de Partners E-NORA (2026-09-25),
# sustituye a la vieja ligada a dashboard.ecomscaling.es.

client_id = "3e6944aee89eac806b5d68e2075b5a1e"
application_url = "https://ecom.noraapp.es"
embedded = true
name = "e-nora scale"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_all_orders fuera por ahora: Shopify rechaza el deploy sin "Access
# request" aprobada en el Partner Dashboard (historico > 60 dias). Pendiente
# solicitarla y volver a anadirlo aqui cuando este aprobada.
scopes = "read_customer_events,read_customers,read_discounts,read_inventory,read_locations,read_marketing_events,read_orders,read_products,read_reports,read_returns,write_pixels"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [
  "http://localhost:4000/v1/shopify/oauth/callback",
  "https://api.ecom.noraapp.es/v1/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.ecom.noraapp.es/v1/shopify/webhooks"
