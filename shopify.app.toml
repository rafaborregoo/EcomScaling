# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# App "e-nora scale" creada en la organizacion de Partners E-NORA (2026-09-25),
# sustituye a la vieja ligada a dashboard.ecomscaling.es. Client secret nuevo
# pendiente de copiar a deploy/.env.production (SHOPIFY_API_SECRET).

client_id = "3e6944aee89eac806b5d68e2075b5a1e"
application_url = "https://ecom.noraapp.es"
embedded = true
name = "e-nora scale"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_all_orders necesita "Access request" aprobada en el Partner Dashboard
# (historico > 60 dias) antes de instalar en tiendas de merchants reales.
scopes = "read_products,read_inventory,read_locations,read_orders,read_all_orders,read_returns,read_customers,read_reports,write_pixels,read_customer_events"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "http://localhost:4000/v1/shopify/oauth/callback",
  "https://api.ecom.noraapp.es/v1/shopify/oauth/callback"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.ecom.noraapp.es/v1/shopify/webhooks"
