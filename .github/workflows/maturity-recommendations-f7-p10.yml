name: maturity-recommendations-f7-p10

on:
  workflow_dispatch:

concurrency:
  group: maturity-recommendations-f7-p10
  cancel-in-progress: false

jobs:
  maturity-recommendations:
    name: Adapt recommendations by maturity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ecomscaling/contracts
      - run: npm run build -w @ecomscaling/api
      - run: npm run build -w @ecomscaling/worker
      - run: npm run start:maturity-recommendations --workspace=@ecomscaling/worker
