name: Shopify Reconcile

on:
  workflow_dispatch:
  # Desactivado 2026-08-03 por peticion de Rafa: sin disparadores
  # automaticos. Para reactivar, descomentar el bloque de abajo.
  # schedule:
  #   - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: shopify-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run Shopify reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      SHOPIFY_CUSTOM_API_KEY: ${{ secrets.SHOPIFY_CUSTOM_API_KEY }}
      SHOPIFY_CUSTOM_API_SECRET: ${{ secrets.SHOPIFY_CUSTOM_API_SECRET }}
      SHOPIFY_CUSTOM_SCOPES: ${{ secrets.SHOPIFY_CUSTOM_SCOPES }}
      SHOPIFY_CUSTOM_REDIRECT_URI: ${{ secrets.SHOPIFY_CUSTOM_REDIRECT_URI }}
      INTEGRATION_FEATURE_FLAGS: shopify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET SHOPIFY_API_KEY SHOPIFY_API_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for Shopify reconciliation." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Reconcile Shopify connections
        run: npm run start:shopify-reconcile -w @ecomscaling/worker
