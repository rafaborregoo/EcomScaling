name: Memory Ingestion

on:
  workflow_dispatch:
  # Desactivado 2026-08-03 por peticion de Rafa: sin disparadores
  # automaticos. Para reactivar, descomentar el bloque de abajo.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: memory-ingestion
  cancel-in-progress: false

jobs:
  process:
    name: Process pending memory ingestion queue rows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Process memory ingestion queue
        run: npm run start:memory-ingestion -w @ecomscaling/worker
