name: Meta Ads Reconcile

on:
  workflow_dispatch:
  # Reactivado 2026-09-08 a peticion de Rafa, junto con klaviyo-reconcile.
  # Estuvo apagado desde el 2026-08-03 y mientras tanto Meta no se refrescaba
  # solo: lo que se ve en /meta era de la ultima pasada manual.
  #
  # Shopify NO se reactiva aqui a proposito: el worker del VPS ya corre
  # shopify-reconcile a diario (02:00 Europe/Madrid, repeatable de BullMQ).
  # Encender ademas shopify-reconcile.yml duplicaria el sync y el gasto de
  # rate limit contra la Admin API.

permissions:
  contents: read

concurrency:
  group: meta-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run Meta Ads reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # loadApiEnv exige las credenciales de Shopify siempre, aunque este cron
      # no toque Shopify: sin ellas el worker aborta al arrancar antes de leer
      # una sola conexion de Meta.
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_REDIRECT_URI: ${{ secrets.META_REDIRECT_URI }}
      META_SCOPES: ${{ secrets.META_SCOPES }}
      INTEGRATION_FEATURE_FLAGS: meta_ads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Reconcile Meta Ads connections
        run: npm run start:meta-reconcile -w @ecomscaling/worker
