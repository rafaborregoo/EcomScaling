name: F7.13 dynamic decisions

on:
  workflow_dispatch:

jobs:
  dynamic-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ecomscaling/api -w @ecomscaling/worker
      - run: npm run start:dynamic-decision -w @ecomscaling/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
