name: Context Engine

# F3/D02. Contextualiza las senales: separa cambio de rendimiento de cambio de
# composicion, elige baseline y examina si la comparacion se sostiene.
#
# Sin `schedule`, igual que los otros dos motores: decision de Rafa del
# 2026-08-03, sin disparadores automaticos. Se lanza a mano hasta que haya
# motivo para automatizarlo. Para activarlo, descomentar el bloque de abajo.
#
# El orden de la cadena, si algun dia se activan: calidad de datos (06:07),
# senales (06:17) y contextualizacion (06:27). Contextualizar antes de detectar
# no tiene nada que contextualizar, y hacerlo antes de evaluar el dato produce
# comparaciones mas limpias de lo que el dato permite.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "27 6 * * *"

permissions:
  contents: read

concurrency:
  group: context-engine
  cancel-in-progress: false

jobs:
  contextualize:
    name: Contextualize signals for all organizations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for the context engine." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Contextualize signals
        run: npm run start:context -w @ecomscaling/worker
