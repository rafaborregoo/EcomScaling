name: F8.03 execution plans

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

jobs:
  execution-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build -w @ecomscaling/api -w @ecomscaling/worker
      - run: npm run start:execution-plan -w @ecomscaling/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
