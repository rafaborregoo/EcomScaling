name: intervention-eligibility-f7-p01

on:
  workflow_dispatch:

jobs:
  intervention-eligibility:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ENV_GUARD: production
      REDIS_URL: ${{ secrets.REDIS_URL }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@ecomscaling/contracts
      - run: npm run build --workspace=@ecomscaling/config
      - run: npm run build --workspace=@ecomscaling/observability
      - run: npm run build --workspace=@ecomscaling/api
      - run: npm run start:intervention-eligibility --workspace=@ecomscaling/worker
