name: decision-impact-p04

on:
  workflow_dispatch:

jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test --workspace=@ecomscaling/contracts
      - run: npm run build --workspace=@ecomscaling/api
      - run: npm run build --workspace=@ecomscaling/worker
