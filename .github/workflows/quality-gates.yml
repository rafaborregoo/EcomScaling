name: Agent judge and repository quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository guards, including release migration preflight
        run: npm run verify

      - name: Build shared packages and API
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build:packages && npm run build --workspace=@e-nora/api

      - name: Typecheck web
        run: npm run typecheck --workspace=web -- --incremental false

      - name: Run AI contracts, rubrics and calibration tests
        run: npm test --workspace=@e-nora/ai

      - name: Run API unit suite, including judge and release admin
        run: npm run test:unit --workspace=@e-nora/api

      - name: Test migration release preflight
        run: npm run test:agent-release-preflight
