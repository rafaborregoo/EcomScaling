name: Agent judge and repository quality gates

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository guards, including release migration preflight
        run: npm run verify

      - name: Build shared packages and API
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build:packages && npm run build --workspace=@e-nora/api

      - name: Typecheck web
        run: npm run typecheck --workspace=web -- --incremental false

      - name: Run AI contracts, rubrics and calibration tests
        run: npm test --workspace=@e-nora/ai

      - name: Run API unit suite, including judge and release admin
        run: npm run test:unit --workspace=@e-nora/api

      - name: Run A24 measurement coverage and final SQL contracts
        run: npm run test:a24-contracts --workspace=@e-nora/api

      - name: Run A26 editorial and final SQL contracts
        run: npm run test:a26-contracts --workspace=@e-nora/api && npm run test:a26-html --workspace=@e-nora/api && node --test ops/email-renderer/render-core.test.mjs

      - name: Test migration release preflight
        run: npm run test:agent-release-preflight

      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/a27-postgres" --package-lock=false --no-audit --no-fund @electric-sql/pglite@0.5.11

      - name: Verify A27 SQL approval, leases, delivery receipts and permissions
        env:
          A27_PGLITE_MODULE: ${{ runner.temp }}/a27-postgres/node_modules/@electric-sql/pglite/dist/index.js
        run: node --test scripts/a27-mailing-db.test.mjs
