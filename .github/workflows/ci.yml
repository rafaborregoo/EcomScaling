name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, build and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (packages, api, web, worker)
        run: npm run typecheck

      # SQO-01: anadido 2026-07-22. Antes bloqueaba porque apps/web tenia 12
      # errores reales de react-hooks/set-state-in-effect (regla nueva del
      # plugin, ver apps/web/eslint.config.mjs para el porque se bajo a
      # warning en vez de reescribir 9 archivos con un patron de
      # fetch-on-mount sin alternativa estable todavia).
      - name: Lint (packages, api, web, worker)
        run: npm run lint

      - name: Build web
        run: npm run build -w web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # AI-06: guarda de calidad de salidas de agentes (checkOutputSanity),
      # pura y sin I/O -- no necesita secrets de Supabase.
      - name: AI output sanity guard tests
        run: npm run test -w @ecomscaling/ai

      # SQO-00: "tests A/B de tenant pasan". Corre contra el Supabase remoto
      # real (no hay entorno de test separado): crea organizaciones/usuarios
      # efimeros y los borra al terminar (ver apps/api/src/rls-tenant-isolation.test.ts).
      - name: RLS tenant isolation tests
        run: npm run test -w @ecomscaling/api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
          SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
