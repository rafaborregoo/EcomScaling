name: CI

on:
  workflow_dispatch:
  # Desactivado 2026-08-03 por peticion de Rafa: sin disparadores
  # automaticos. Para reactivar, descomentar el bloque de abajo.
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, build and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # BE-00: escaneo de dependencias, gap declarado de la fase. No es
      # `npm audit --audit-level=high` directo porque hoy fallaria siempre por
      # 3 vulnerabilidades del arbol de Next sin version parcheada, y un paso
      # que siempre falla se termina ignorando. El guard falla solo si la
      # situacion empeora (ver scripts/audit-guard.mjs).
      - name: Dependency audit
        run: node scripts/audit-guard.mjs

      - name: Typecheck (packages, api, web, worker)
        run: npm run typecheck

      # SQO-01: anadido 2026-07-22. Antes bloqueaba porque apps/web tenia 12
      # errores reales de react-hooks/set-state-in-effect (regla nueva del
      # plugin, ver apps/web/eslint.config.mjs para el porque se bajo a
      # warning en vez de reescribir 9 archivos con un patron de
      # fetch-on-mount sin alternativa estable todavia).
      - name: Lint (packages, api, web, worker)
        run: npm run lint

      - name: Build web
        run: npm run build -w web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # SQO-01: `portal-state-contract.test.ts` existia desde FE-08 pero no lo
      # ejecutaba nadie. Ambos son puros (leen fuentes o construyen Response en
      # memoria), no necesitan navegador ni secrets.
      - name: Web contract tests
        run: npm run test -w web

      # AI-06: guarda de calidad de salidas de agentes (checkOutputSanity),
      # pura y sin I/O -- no necesita secrets de Supabase.
      - name: AI output sanity guard tests
        run: npm run test -w @ecomscaling/ai

      # SQO-01: regresion del bug real de repetibles huerfanos en BullMQ
      # (apps/worker/src/repeatable-jobs.ts), pura y sin I/O -- no necesita
      # Redis ni secrets.
      - name: Worker repeatable-job tests
        run: npm run test -w @ecomscaling/worker

      # SQO-01: reglas reales de validacion de env vars (requeridas, grupos
      # todo-o-nada de Shopify custom/Meta, default de META_SCOPES), pura y
      # sin I/O -- no necesita secrets.
      - name: Config env validation tests
        run: npm run test -w @ecomscaling/config

      # INT-00: contrato común, estados honestos y feature flags de Shopify,
      # Meta, Klaviyo e Instagram.
      - name: Integration contract tests
        run: npm run test -w @ecomscaling/integrations

      # SQO-02: redacción de secretos y métricas process-local.
      - name: Observability tests
        run: npm run test -w @ecomscaling/observability

      # SQO-00: el pipeline normal no escribe en ninguna base de datos.
      # Los tests RLS con fixtures requieren un entorno aislado y quedan como
      # validacion manual hasta provisionar staging.
      # test:unit no carga .env.local. El test de feature flags construye Fastify
      # y necesita pasar la validacion estructural de env; estos valores dummy
      # no se usan para conectarse ni contienen secretos.
      - name: API unit and contract tests
        run: npm run test:unit -w @ecomscaling/api
        env:
          API_HOST: "127.0.0.1"
          API_PORT: "4000"
          WEB_ORIGIN: "http://localhost:3000"
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_PUBLISHABLE_KEY: "ci-publishable-key"
          SHOPIFY_API_KEY: "ci-shopify-key"
          SHOPIFY_API_SECRET: "ci-shopify-secret"
          SHOPIFY_SCOPES: "read_products"
          SHOPIFY_REDIRECT_URI: "https://example.com/shopify/callback"
          INTEGRATION_FEATURE_FLAGS: "shopify"

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # El job `dependency-scan` que habia aqui corria `npm audit --omit=dev
  # --audit-level=high` y por tanto fallaba en cada ejecucion por las 3
  # vulnerabilidades del arbol de Next que no tienen version parcheada.
  # Sustituido 2026-08-03 por el paso `Dependency audit` de `checks`, que usa
  # scripts/audit-guard.mjs y solo falla si la situacion empeora.

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
