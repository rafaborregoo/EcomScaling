name: F6 P11 scalability benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: "50 4 * * *"
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@ecomscaling/contracts && npm run build --workspace=@ecomscaling/config && npm run build --workspace=@ecomscaling/observability && npm run build --workspace=@ecomscaling/api && npm run start:scalability-benchmarks --workspace=@ecomscaling/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
