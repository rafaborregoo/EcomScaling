name: Offer pricing benchmarks P06
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ENV_GUARD: production
      REDIS_URL: ${{ secrets.REDIS_URL }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build --workspace=@ecomscaling/contracts
      - run: npm run test:offer-pricing-benchmarks --workspace=@ecomscaling/api
      - run: npm run build --workspace=@ecomscaling/api
      - run: npm run build --workspace=@ecomscaling/worker
      - run: npm run start:offer-pricing-benchmarks --workspace=@ecomscaling/worker
