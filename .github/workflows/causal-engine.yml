name: Causal Engine

# F3/D07. Recorre hacia atras el grafo causal declarado desde el target de cada
# caso abierto y escribe las rutas candidatas con su soporte, sus
# contradicciones y lo que falta por comprobar.
#
# **Ninguna ruta sale `supported` hoy, y no es un fallo.** El guardrail 50 dice
# que una ruta con huecos declarados no esta soportada, y siempre queda uno:
# nadie ha revisado los confusores de D02 contra ninguna ruta. Lo que si produce
# --y es el valor del bloque-- es la poda: si las ventas caen y los pedidos, que
# se vigilan, no se movieron, esa rama queda contradicha y lo que se hundio es el
# ticket medio. Una rama sin serie, en cambio, queda **sin probar**, que no es lo
# mismo.
#
# Sin `schedule`, igual que los otros ocho motores: decision de Rafa del
# 2026-08-03. Para activarlo, descomentar el bloque de abajo.
#
# Va detras de sintomas (06:37) y delante de severidad (06:57), porque D10 y D11
# leen lo que este deja.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "42 6 * * *"

permissions:
  contents: read

concurrency:
  group: causal-engine
  cancel-in-progress: false

jobs:
  causal:
    name: Explore causal paths for all organizations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for the causal engine." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Explore causal paths
        run: npm run start:causal -w @ecomscaling/worker
