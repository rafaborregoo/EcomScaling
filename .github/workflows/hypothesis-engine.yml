name: Hypothesis Engine

# F3/D08. Convierte cada ruta candidata de D07 en una hipotesis explicita, con su
# estado, lo que la falsaria y el siguiente dato que la despejaria.
#
# **Lo que aporta que no aportaba D07** son dos cosas. Las descartadas se guardan
# con su motivo, asi que dentro de un mes nadie repite una busqueda que ya se
# hizo. Y se escribe sola la hipotesis de que **no haya pasado nada** cuando
# alguna ruta pasa por una metrica de tracking: esa explicacion no sale de
# ninguna ruta causal --no la hay-- y es la unica que puede tumbar a todas las
# demas de golpe. Es el challenger del guardrail 12.
#
# No elige ninguna. El guardrail 1 dice que la primera causa plausible no es un
# diagnostico, y decidir es D09.
#
# Sin `schedule`, igual que los otros nueve motores: decision de Rafa del
# 2026-08-03. Para activarlo, descomentar el bloque de abajo.
#
# Va detras del causal (06:42) y delante de la severidad (06:57).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "47 6 * * *"

permissions:
  contents: read

concurrency:
  group: hypothesis-engine
  cancel-in-progress: false

jobs:
  hypothesis:
    name: Generate and contrast hypotheses for all organizations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for the hypothesis engine." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Generate hypotheses
        run: npm run start:hypothesis -w @ecomscaling/worker
