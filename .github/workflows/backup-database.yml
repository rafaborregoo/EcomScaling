name: Backup Database

on:
  workflow_dispatch:
    inputs:
      run_restore_drill:
        description: "Restaurar el dump en SUPABASE_RESTORE_DB_URL desechable"
        required: true
        default: false
        type: boolean
  # Desactivado 2026-08-03 por peticion de Rafa: sin disparadores
  # automaticos. Para reactivar, descomentar el bloque de abajo.
  # schedule:
  #   - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    name: Dump Supabase Postgres and upload as artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
      RUN_RESTORE_DRILL: ${{ inputs.run_restore_drill }}

    steps:
      - name: Install postgresql-client-17
        # El pg_dump de Ubuntu (postgresql-client, 16.x) rechaza volcar un
        # servidor mas nuevo que el (Supabase corre Postgres 17.6). Se instala
        # el cliente 17 desde el repositorio oficial de PGDG en vez del que
        # trae Ubuntu por defecto. Instalar el paquete no basta: /usr/bin/pg_dump
        # sigue siendo el 16.x de Ubuntu (bug real que tumbaba este workflow en
        # el 100% de sus corridas, ver runbook), asi que se antepone
        # /usr/lib/postgresql/17/bin al PATH del resto de pasos via GITHUB_PATH
        # en vez de confiar en que apt lo haga automatico.
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump database
        run: |
          set -euo pipefail
          echo "pg_dump resuelto: $(command -v pg_dump) ($(pg_dump --version))"
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See RB-007 for setup." >&2
            exit 1
          fi
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          DUMP_FILE="ecomscaling-backup-${TIMESTAMP}.dump"
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file="$DUMP_FILE"
          echo "DUMP_FILE=$DUMP_FILE" >> "$GITHUB_ENV"

      - name: Verify dump integrity
        run: |
          set -euo pipefail
          pg_restore --list "$DUMP_FILE" > /dev/null
          sha256sum "$DUMP_FILE" > "$DUMP_FILE.sha256"

      - name: Optional restore drill on disposable target
        if: ${{ inputs.run_restore_drill == true }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_RESTORE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_RESTORE_DB_URL secret is required for a restore drill." >&2
            exit 1
          fi
          if [ "$SUPABASE_DB_URL" = "$SUPABASE_RESTORE_DB_URL" ]; then
            echo "::error::Restore target must differ from SUPABASE_DB_URL; production is never a drill target." >&2
            exit 1
          fi
          pg_restore --clean --if-exists --no-owner --no-privileges \
            --dbname "$SUPABASE_RESTORE_DB_URL" "$DUMP_FILE"
          psql "$SUPABASE_RESTORE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public.organizations') is null then
              raise exception 'restored schema is missing public.organizations';
            end if;
            if not exists (
              select 1 from pg_policies
              where schemaname = 'public'
                and tablename = 'organizations'
                and policyname = 'organizations_select_authorized'
            ) then
              raise exception 'restored schema is missing organizations RLS policy';
            end if;
          end $$;
          SQL

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DUMP_FILE }}
          path: |
            ${{ env.DUMP_FILE }}
            ${{ env.DUMP_FILE }}.sha256
          if-no-files-found: error
          retention-days: 30
