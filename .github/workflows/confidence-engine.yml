name: Confidence Engine

# F3/D11. Dice, capa por capa, cuanto se puede afirmar de cada cosa de un caso y
# que falta para afirmar mas.
#
# **Hoy las capas `why`, `root_cause` y `constraint` salen siempre desconocidas**,
# porque D07, D08 y D09 no tienen motor: no hay grafo causal que recorrer. Eso no
# es un fallo del motor, es el estado real del sistema -- y escribirlo es lo que
# impide que un caso descrito se lea como un caso explicado.
#
# Sin `schedule`, igual que los otros siete motores: decision de Rafa del
# 2026-08-03, sin disparadores automaticos. Se lanza a mano hasta que haya motivo
# para automatizarlo. Para activarlo, descomentar el bloque de abajo.
#
# **Es el ultimo de la cadena**: lee lo que escribieron D01, D05, D06 y D10. Si
# algun dia se activan (calidad 06:07, senales 06:17, contexto 06:27, sintomas
# 06:37, salud 06:47, severidad 06:57), este va a las 07:07. Lanzarlo antes
# califica un caso vacio.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "47 6 * * *"

permissions:
  contents: read

concurrency:
  group: confidence-engine
  cancel-in-progress: false

jobs:
  confidence:
    name: Assess claim confidence for all organizations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for the confidence engine." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Assess confidence
        run: npm run start:confidence -w @ecomscaling/worker
