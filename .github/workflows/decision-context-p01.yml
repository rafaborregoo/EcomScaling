name: F4 P01 decision context

on:
  workflow_dispatch:

jobs:
  verify-decision-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test packages/contracts/src/decision-context.test.ts
      - run: npm run build --workspace=@ecomscaling/api
      - run: npm run build --workspace=@ecomscaling/worker
