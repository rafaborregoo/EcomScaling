name: Agent Offline Evals

on:
  workflow_dispatch:
  # Desactivado hasta autorizar la ejecucion automatica en el entorno remoto.
  # schedule:
  #   - cron: "11 2 * * *"

permissions:
  contents: read

concurrency:
  group: agent-offline-evals
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run deterministic agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AI, API and worker
        run: npm run build -w @ecomscaling/ai && npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Persist offline agent eval evidence
        run: npm run start:agent-evals -w @ecomscaling/worker
