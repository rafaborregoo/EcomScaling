name: Maturity Engine

# F3/D03. Mira el dato de la tienda y dice que capacidades demuestra el negocio
# --con el numero delante-- y cuales no se pueden ver. No calcula brechas: el
# artefacto dice que los umbrales no estan definidos, y no se inventan.
#
# Sin `schedule`, igual que los otros cuatro motores: decision de Rafa del
# 2026-08-03, sin disparadores automaticos. Se lanza a mano hasta que haya
# motivo para automatizarlo. Para activarlo, descomentar el bloque de abajo.
#
# Este no tiene sitio en la cadena porque no depende de ella: mide de que es
# capaz el negocio, no que se ha movido. Si algun dia se activan los demas
# (calidad 06:07, senales 06:17, contexto 06:27, sintomas 06:37), este puede ir
# donde quiera; 05:47 lo deja fuera de la ventana de los otros cuatro.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "47 5 * * *"

permissions:
  contents: read

concurrency:
  group: maturity-engine
  cancel-in-progress: false

jobs:
  maturity:
    name: Observe capability maturity for all organizations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required runtime secrets
        run: |
          set -euo pipefail
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required secret $key is not configured for the maturity engine." >&2
              exit 1
            fi
          done

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Observe maturity
        run: npm run start:maturity -w @ecomscaling/worker
