name: Klaviyo Reconcile

on:
  workflow_dispatch:
  # Reactivado 2026-09-08 a peticion de Rafa. Estuvo apagado desde el
  # 2026-08-03, y mientras tanto el modulo de Klaviyo no se refrescaba solo: lo
  # que se ve en /klaviyo era de la ultima pasada manual.
  #
  # Meta y Shopify siguen apagados (mismos ficheros, misma fecha): esos son otra
  # decision.

permissions:
  contents: read

concurrency:
  group: klaviyo-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run Klaviyo reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      # loadApiEnv exige las credenciales de Shopify siempre, aunque este cron
      # no toque Shopify: sin ellas el worker aborta al arrancar antes de leer
      # una sola conexion de Klaviyo.
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      KLAVIYO_CLIENT_ID: ${{ secrets.KLAVIYO_CLIENT_ID }}
      KLAVIYO_CLIENT_SECRET: ${{ secrets.KLAVIYO_CLIENT_SECRET }}
      KLAVIYO_REDIRECT_URI: ${{ secrets.KLAVIYO_REDIRECT_URI }}
      KLAVIYO_SCOPES: ${{ secrets.KLAVIYO_SCOPES }}
      # Este cron declara su propio gate; no hereda un allowlist global que
      # pudiera activar accidentalmente otro proveedor.
      INTEGRATION_FEATURE_FLAGS: klaviyo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Reconcile Klaviyo connections
        run: npm run start:klaviyo-reconcile -w @ecomscaling/worker
