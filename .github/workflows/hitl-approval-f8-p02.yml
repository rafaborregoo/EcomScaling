name: F8.02 HITL approval

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"

jobs:
  hitl-approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @ecomscaling/api -w @ecomscaling/worker
      - run: npm run start:hitl-approval -w @ecomscaling/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
