name: Ops Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: ops-health-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check for operational issues and file/update a GitHub issue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
      SHOPIFY_SCOPES: ${{ secrets.SHOPIFY_SCOPES }}
      SHOPIFY_REDIRECT_URI: ${{ secrets.SHOPIFY_REDIRECT_URI }}
      # Ruta absoluta a proposito (bug real que tumbaba este workflow en el
      # 100% de sus corridas): `npm run <script> -w <workspace>` ejecuta con
      # cwd = apps/worker/, asi que una ruta relativa aqui escribia el JSON en
      # apps/worker/ops-health-findings.json, pero el paso siguiente
      # (actions/github-script) lee con cwd = raiz del repo -> ENOENT siempre.
      OPS_HEALTH_CHECK_OUTPUT: ${{ github.workspace }}/ops-health-findings.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API and worker
        run: npm run build -w @ecomscaling/api && npm run build -w @ecomscaling/worker

      - name: Run health check
        run: npm run start:ops-health-check -w @ecomscaling/worker

      - name: Create or update GitHub issue for open findings
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.env.OPS_HEALTH_CHECK_OUTPUT, "utf8"));
            const findings = result.findings ?? [];

            const ISSUE_TITLE = "[ops-alert] Chequeo de salud operativa";
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ops-alert",
            });
            const existing = existingIssues.find((issue) => issue.title === ISSUE_TITLE);

            if (findings.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Chequeo de ${result.checkedAt}: sin hallazgos. Cerrando.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            const body = [
              `Chequeo de ${result.checkedAt} — ${findings.length} hallazgo(s):`,
              "",
              ...findings.map(
                (f) => `- **${f.type}**: ${f.summary} (ver \`roadmap/roadmaps/07-operacion-despliegue/runbooks/${f.runbook}\`)`,
              ),
              "",
              "<details><summary>Detalle completo (JSON)</summary>",
              "",
              "```json",
              JSON.stringify(findings, null, 2),
              "```",
              "</details>",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
                labels: ["ops-alert"],
              });
            }
