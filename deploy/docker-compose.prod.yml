name: e-nora

# Produccion en el VPS: api + worker + redis + caddy (TLS automatico).
# La web (Next.js) va en Vercel, no aqui.
# IMAGE_TAG se escribe A MANO en ./.env con el SHA del commit desplegado: desde
# que no hay GitHub Actions (2b2ab70) nadie lo actualiza solo. Ver deploy/README.md.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/rafaborregoo/ecomscaling-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - default
      - host-metrics
    env_file: [.env.production]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      REDIS_URL: redis://redis:6379
      NODE_EXPORTER_URL: http://node-exporter:9100/metrics
      CADVISOR_URL: http://cadvisor:8080/metrics
      DOCKER_API_URL: http://docker-proxy:2375
      EMAIL_RENDER_SPOOL_DIR: /var/run/e-nora/email-render
      # AI-30: se guarda en agent_runs.deployment_version para poder atar un
      # comportamiento de produccion al codigo exacto que lo produjo. IMAGE_TAG
      # es el SHA del commit desplegado.
      #
      # OJO: al construir en el VPS (docker-compose.build.yml) la imagen se
      # llama :local y IMAGE_TAG deja de elegirla, pero SIGUE etiquetando esta
      # variable. Si no se actualiza a mano, deployment_version miente. Por eso
      # el deploy escribe el SHA real en ./.env aunque no se use para el pull.
      GIT_SHA: ${IMAGE_TAG:-latest}
    volumes:
      - email-render-spool:/var/run/e-nora/email-render
    group_add:
      - "2000"
      # R-020: OPENAI_API_KEY y OPENAI_MODEL NO se declaran aqui a proposito.
      # `env_file: .env.production` ya las inyecta. Declararlas en `environment`
      # las romperia: `environment` tiene prioridad sobre `env_file`, y
      # ${OPENAI_API_KEY:-} se resuelve contra el .env del proyecto compose
      # (/opt/e-nora/.env, que solo tiene IMAGE_TAG), asi que quedarian
      # vacias y el fallback a OpenAI jamas podria entrar -- justo lo contrario
      # de lo que se buscaba. Comprobado con `docker compose config`.
    depends_on:
      redis:
        condition: service_healthy
      cadvisor:
        condition: service_started
      docker-proxy:
        condition: service_started
      email-render-spool-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000" # solo para debug local en el VPS

  worker:
    image: ghcr.io/rafaborregoo/ecomscaling-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${IMAGE_TAG:-latest}
      # El worker llama a la API por la red interna. Sin esto el schema de
      # @e-nora/config cae al default http://localhost:4000, que dentro
      # del contenedor no es la API -> todos los jobs fallan con fetch failed.
      API_URL: http://api:4000
    depends_on:
      redis:
        condition: service_healthy

  # Métricas del host para platform_admin. El puerto solo existe en la red
  # interna de Compose; no se publica en el VPS ni queda expuesto a Internet.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    networks:
      - host-metrics
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.10
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  # MÃ©tricas de CPU, memoria y OOM por contenedor. Solo red interna.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks: [host-metrics]
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --max_housekeeping_interval=15s
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0
    volumes:
      - /:/rootfs:ro,rslave
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25

  # API Docker de solo lectura y aislada; el socket no se monta dentro del API.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks: [host-metrics]
    environment:
      CONTAINERS: 1
      POST: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.10

  email-render-spool-init:
    image: node:24-alpine
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -c
      - mkdir -p /spool/queued /spool/processing /spool/completed /spool/failed && chown -R 1000:2000 /spool && chmod -R g+rwX /spool && find /spool -type d -exec chmod 2770 {} +
    volumes:
      - email-render-spool:/spool

  email-renderer:
    image: e-nora-email-renderer:local
    restart: unless-stopped
    init: true
    user: "1000:2000"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    shm_size: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      EMAIL_RENDER_SPOOL: /spool
    volumes:
      - email-render-spool:/spool
    depends_on:
      email-render-spool-init:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env.production] # lee API_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  redis-data:
  email-render-spool:
  caddy-data:
  caddy-config:

networks:
  host-metrics:
    internal: true
