name: ecomscaling

# Produccion en el VPS: api + worker + redis + caddy (TLS automatico).
# La web (Next.js) va en Vercel, no aqui.
# IMAGE_TAG se escribe A MANO en ./.env con el SHA del commit desplegado: desde
# que no hay GitHub Actions (2b2ab70) nadie lo actualiza solo. Ver deploy/README.md.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/rafaborregoo/ecomscaling-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      REDIS_URL: redis://redis:6379
      # AI-30: se guarda en agent_runs.deployment_version para poder atar un
      # comportamiento de produccion al codigo exacto que lo produjo. IMAGE_TAG
      # es el SHA del commit desplegado.
      #
      # OJO: al construir en el VPS (docker-compose.build.yml) la imagen se
      # llama :local y IMAGE_TAG deja de elegirla, pero SIGUE etiquetando esta
      # variable. Si no se actualiza a mano, deployment_version miente. Por eso
      # el deploy escribe el SHA real en ./.env aunque no se use para el pull.
      GIT_SHA: ${IMAGE_TAG:-latest}
      # R-020: OPENAI_API_KEY y OPENAI_MODEL NO se declaran aqui a proposito.
      # `env_file: .env.production` ya las inyecta. Declararlas en `environment`
      # las romperia: `environment` tiene prioridad sobre `env_file`, y
      # ${OPENAI_API_KEY:-} se resuelve contra el .env del proyecto compose
      # (/opt/ecomscaling/.env, que solo tiene IMAGE_TAG), asi que quedarian
      # vacias y el fallback a OpenAI jamas podria entrar -- justo lo contrario
      # de lo que se buscaba. Comprobado con `docker compose config`.
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"   # solo para debug local en el VPS

  worker:
    image: ghcr.io/rafaborregoo/ecomscaling-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${IMAGE_TAG:-latest}
      # El worker llama a la API por la red interna. Sin esto el schema de
      # @ecomscaling/config cae al default http://localhost:4000, que dentro
      # del contenedor no es la API -> todos los jobs fallan con fetch failed.
      API_URL: http://api:4000
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env.production]   # lee API_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  redis-data:
  caddy-data:
  caddy-config:
