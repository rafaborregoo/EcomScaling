# Override para construir las imagenes EN EL VPS desde el codigo en ./src,
# en vez de bajarlas de GHCR (util mientras GitHub Actions no esta disponible).
#
# Uso, desde /opt/ecomscaling:
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
#
# Requiere el repo clonado en /opt/ecomscaling/src

services:
  api:
    image: ecomscaling-api:local
    build:
      context: ./src
      dockerfile: apps/api/Dockerfile

  worker:
    image: ecomscaling-worker:local
    build:
      context: ./src
      dockerfile: apps/worker/Dockerfile
